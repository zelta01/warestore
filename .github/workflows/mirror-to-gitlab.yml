name: Mirror to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is not set — add it under Settings → Secrets → Actions."
            exit 1
          fi
          REMOTE="https://oauth2:${GITLAB_TOKEN}@gitlab.com/bet3rd/warestore.git"
          git push --force "$REMOTE" HEAD:refs/heads/main
          git push --force --tags "$REMOTE"
          echo "Mirrored main + tags to gitlab.com/bet3rd/warestore"
